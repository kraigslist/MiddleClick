name: CI

on:
  push:
    branches: ["2.7.1"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/build.sh
      - run: scripts/test.sh
      - run: scripts/replay-past-bugs.sh

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: scripts/model-check.sh

  xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project MiddleClick.xcodeproj -scheme MiddleClick -configuration Release CODE_SIGNING_ALLOWED=NO build
